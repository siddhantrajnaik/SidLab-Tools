name: Deploy to GitHub Pages

# Builds the site and publishes it to Pages on every push to main. Replaces the manual
# `npm run deploy` (gh-pages -d dist) step, which had to be remembered by hand and is why
# the live site once sat months behind main.
#
# Requires the repository's Pages source to be set to "GitHub Actions"
# (Settings -> Pages -> Build and deployment -> Source).

on:
  push:
    branches: [main]
  # Allows a deploy to be triggered by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway, but only keep one queued.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The formulas are the product, so a wrong constant must block the deploy rather
      # than ship. These assert against published reference values, not against whatever
      # the code currently returns.
      - name: Test
        run: npm test

      # `npm run build` is `tsc && vite build`, so a type error fails the deploy too.
      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
