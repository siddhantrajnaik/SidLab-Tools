<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sidlab Tools</title>
    <meta name="description" content="Offline-capable laboratory calculators: dilutions, molarity, pH, primer Tm, SDS-PAGE gels, cell counts and more." />
    <!-- PWA. The manifest and icon links are injected at build time by vite-plugin-pwa;
         these are the bits it does not generate. -->
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sidlab Tools" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      .font-logo {
        font-family: 'Architects Daughter', cursive;
      }
      @media print {
        @page {
          margin: 1cm;
        }
        body {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
      }
    </style>
  </head>
  <body class="bg-white text-slate-900 antialiased selection:bg-pink-100 selection:text-pink-900">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
